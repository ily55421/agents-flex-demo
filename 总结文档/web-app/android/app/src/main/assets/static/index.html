<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c8cff" />
  <meta name="description" content="基于 SQLite FTS5 的文档博客系统，支持全文检索、分类浏览、标签管理" />
  <title>📚 文档博客 · 知识库</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/prism-tomorrow.css" id="prismTheme" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
</head>
<body>

<!-- 遮罩（移动端） -->
<div class="overlay" id="overlay"></div>

<!-- 图片灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <img src="" alt="" id="lightboxImg" />
</div>

<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>📚 文档博客</h1>
    <div class="subtitle">SQLite FTS5 全文检索</div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="loading">加载中</div>
  </nav>
  <div class="sidebar-footer">
    <span id="sidebarStats">加载中...</span>
  </div>
</aside>

<!-- 主内容 -->
<div class="main" id="main">
  <!-- 顶部搜索栏 -->
  <div class="topbar">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索文档... (支持中文全文检索)" autocomplete="off" />
      <span class="search-shortcut">Ctrl+K</span>
      <!-- 搜索建议下拉 -->
      <div class="search-suggest" id="searchSuggest"></div>
      <!-- 搜索历史下拉 -->
      <div class="search-history" id="searchHistory"></div>
    </div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">
      <span class="theme-icon-light">☀️</span>
      <span class="theme-icon-dark">🌙</span>
    </button>
  </div>

  <!-- 动态内容区 -->
  <div class="content-wrapper" id="contentWrapper">
    <div class="content" id="content">
      <div class="loading">加载中</div>
    </div>
    <!-- 章节导航条（文章页显示） -->
    <aside class="toc-sidebar" id="tocSidebar">
      <div class="toc-title">📑 章节</div>
      <nav class="toc-nav" id="tocNav"></nav>
    </aside>
  </div>
</div>

<!-- 返回顶部 -->
<button class="back-to-top" id="backToTop">↑</button>

<script src="/js/prism.min.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        primaryColor: '#6c8cff',
        primaryTextColor: '#e2e8f0',
        primaryBorderColor: '#6c8cff',
        lineColor: '#94a3b8',
        secondaryColor: '#1e293b',
        tertiaryColor: '#0f172a',
        fontFamily: 'system-ui, -apple-system, sans-serif'
      },
      flowchart: {
        useMaxWidth: true,
        htmlLabels: true,
        curve: 'basis'
      }
    });
    window.mermaid = mermaid;
  </script>
</body>
</html>
